<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whisper SRT 생성기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>🎬 Whisper SRT 생성기</h1>
        <p class="description">회의/강의 영상을 올리고 바로 SRT 자막 파일을 만들어보세요.</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert">
              {% for message in messages %}
                <p>{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="post" enctype="multipart/form-data" class="form">
          <label for="media_file" class="label">1) 파일 업로드</label>
          <input id="media_file" name="media_file" type="file" accept="video/*,audio/*" required />

          <label for="language" class="label">2) 언어 선택</label>
          <select id="language" name="language">
            {% for code, name in languages %}
              <option value="{{ code }}">{{ name }}</option>
            {% endfor %}
          </select>

          <button type="submit" class="button">3) 자막 생성</button>
        </form>

        <ul class="tips">
          <li>지원 형식: mp4, mkv, mov, avi, mp3, wav, m4a, webm</li>
          <li>처리 시간은 영상 길이에 따라 달라집니다.</li>
        </ul>
      </section>
    </main>
  </body>
</html>
